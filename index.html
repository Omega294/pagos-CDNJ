<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDNJ - Plataforma Modular de Gestión Escolar</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg-primary: #0b0f19;
      --bg-surface: #131b2e;
      --bg-surface-hover: #1b2640;
      --bg-card: rgba(23, 32, 54, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(99, 102, 241, 0.4);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.3);
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--bg-primary); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 16px; height: 16px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.85); border-radius: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 8px; border: 3px solid rgba(15, 23, 42, 0.85); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(129, 140, 248, 0.8); }
    * { scrollbar-width: auto; scrollbar-color: rgba(255, 255, 255, 0.3) rgba(15, 23, 42, 0.85); }

    /* Glass Panels */
    .glass-panel { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .glass-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 10px; padding: 1rem; transition: all 0.2s ease; }
    .glass-card:hover { border-color: var(--border-highlight); transform: translateY(-2px); }

    /* Layout */
    .app-container { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: rgba(19, 27, 46, 0.85); border-right: 1px solid var(--border-color); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .main-content { flex: 1; display: flex; flex-direction: column; }
    .navbar { height: 70px; background: rgba(19, 27, 46, 0.9); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; sticky: top: 0; z-index: 10; }
    .page-body { padding: 2rem; flex: 1; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.6rem 1.2rem; font-family: var(--font-family); font-size: 0.9rem; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s ease; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; box-shadow: 0 4px 14px var(--primary-glow); }
    .btn-accent { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); color: white; box-shadow: 0 4px 14px var(--accent-glow); }
    .btn-danger { background: linear-gradient(135deg, var(--danger), var(--danger-hover)); color: white; }
    .btn-secondary { background: rgba(255,255,255,0.06); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }

    /* Inputs */
    .input-field, .select-field, .textarea-field { width: 100%; padding: 0.7rem 1rem; background: rgba(11, 15, 25, 0.8); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-family: var(--font-family); font-size: 0.9rem; outline: none; transition: all 0.2s ease; }
    .input-field:focus, .select-field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
    .badge-success { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-warning { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-primary { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }

    /* Tables */
    .table-container { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-surface); }
    .custom-table { width: 100%; border-collapse: collapse; text-align: left; }
    .custom-table th { background: rgba(11, 15, 25, 0.9); padding: 0.85rem 1.2rem; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
    .custom-table td { padding: 0.9rem 1.2rem; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    .custom-table tbody tr:hover { background: var(--bg-surface-hover); }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1.5rem; }
    .modal-content { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; padding: 1.75rem; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }

    /* Printable Receipt */
    .receipt-printable { background: #ffffff; color: #111827; padding: 1.75rem; border-radius: 8px; font-family: 'Courier New', monospace; }
  </style>
</head>
<body>

  <div id="app">
    <!-- View Rendered Dynamically by JS -->
  </div>

  <script>
    // Auto Reset if ?reset=true in URL
    if (window.location.search.includes('reset=true')) {
      try {
        if (typeof localStorage !== 'undefined' && localStorage) {
          localStorage.clear();
          console.log("LocalStorage reset triggered by URL parameter");
        }
      } catch(e) {}
      try {
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch(e) {}
    }

    // Global Error Boundary to prevent blank screens
    window.onerror = function(msg, url, line, col, error) {
      console.error("Global JS Error:", msg, error);
      const app = document.getElementById('app');
      if (app) {
        app.innerHTML = `
          <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; background:#0b0f19; color:#f3f4f6;">
            <div style="background:#131b2e; border:1px solid rgba(239,68,68,0.4); padding:2rem; border-radius:16px; text-align:center; max-width:500px;">
              <h2 style="color:#ef4444; margin-bottom:1rem;">⚠️ Error al Cargar la Interfaz</h2>
              <p style="color:#9ca3af; font-size:0.9rem; margin-bottom:1.5rem;">${msg || 'Se produjo un error al renderizar los componentes.'}</p>
              <button onclick="localStorage.clear(); location.reload();" class="btn btn-primary">🔄 Restablecer Sesión y Recargar</button>
            </div>
          </div>
        `;
      }
    };



    // Safe Storage Helper for restricted browser contexts
    const _memStore = {};
    function getStorageItem(k) {
      try { if (typeof localStorage !== 'undefined' && localStorage) return localStorage.getItem(k); } catch(e) {}
      return _memStore[k] || null;
    }
    function setStorageItem(k, v) {
      try { if (typeof localStorage !== 'undefined' && localStorage) { localStorage.setItem(k, v); return; } } catch(e) {}
      _memStore[k] = v;
    }
    function removeStorageItem(k) {
      try { if (typeof localStorage !== 'undefined' && localStorage) { localStorage.removeItem(k); return; } } catch(e) {}
      delete _memStore[k];
    }
    function safeParseJSON(str) {
      if (!str) return null;
      try { return JSON.parse(str); } catch(e) { return null; }
    }

    // Configuración Base de la API REST (Soporta protocolo file:// y servidor http://)
    const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : '';

    // Global Grades List
    const ALL_GRADES = [
      { code: "1er Grado", name: "1er Grado de Primaria" },
      { code: "2do Grado", name: "2do Grado de Primaria" },
      { code: "3er Grado", name: "3er Grado de Primaria" },
      { code: "4to Grado", name: "4to Grado de Primaria" },
      { code: "5to Grado", name: "5to Grado de Primaria" },
      { code: "6to Grado", name: "6to Grado de Primaria" },
      { code: "1er Año", name: "1er Año (7mo Grado Básica)" },
      { code: "2do Año", name: "2do Año (8vo Grado Básica)" },
      { code: "3er Año", name: "3er Año (9no Grado Básica)" },
      { code: "4to Año", name: "4to Año (Media Diversificada)" },
      { code: "5to Año", name: "5to Año (Media Diversificada)" }
    ];

    // State Manager
    const state = {
      token: getStorageItem('cdnj_token'),
      user: safeParseJSON(getStorageItem('cdnj_user')),
      activeTab: 'cashier',
      searchMode: 'all', // 'all', 'rep', 'est', 'cedula'
      searchQuery: '',
      searchResults: [],
      selectedStudent: null,
      debts: [],
      selectedDebtIds: [],
      isPartial: false,
      partialAmountUSD: 0,
      exchangeRate: 36.50,
      paymentMethods: [{ method: 'CASH_USD', amount: 0, currency: 'USD', reference: '' }],
      transactions: [],
      dashboardPeriod: 'daily',
      dashboardData: null,
      dashboardLoading: false,
      activeReceiptModalId: null,
      showAdvanceModal: false,
      advanceModalStudentId: null,
      advanceOptionsData: null,
      advanceSelectedMonths: [],
      advanceApplyToAllSiblings: false,
      advanceModalLoading: false,
      advanceModalError: null,
      showVoidModal: null,
      voidReason: '',
      showClosingModal: false,
      closingData: null,
      showPaymentConfirmModal: false,
      paymentCurrency: 'USD',
      paymentMethod: 'CASH_USD',
      paymentReference: '',
      paymentBank: '',
      paymentModalError: null,
      bcvRateData: null,
      rateHistoryWeek: [],
      historicalQueryDate: '',
      historicalQueryResult: null,
      tuitionRatesData: null,
      tuitionMode: 'GLOBAL',
      globalTuitionInput: 50.0,
      groupTuitionInputs: { 'Primaria': 50.0, 'Educación Básica': 50.0, 'Media y Diversificada': 50.0 },
      gradeTuitionInputs: {},
      reEnrollmentData: null,
      reEnrollmentEnabled: true,
      loadingReEnrollment: false,
      paperControl: null,
      showPaperCheckModal: false,
      pendingPaperCheckNumber: null,
      showPaperDiscrepancyInput: false,
      showPaperBatchModal: false,
      paperBatchModalData: null,
      paperBatchSearch: '',
      paperLogs: [],
      reEnrollmentFilterGrade: 'ALL',
      reEnrollmentFilterStatus: 'ALL',
      reEnrollmentSearch: '',
      dashboardPeriod: 'daily',
      dashboardData: null,
      studentsList: [],
      studentsGuardiansList: [],
      studentsSearchQuery: '',
      studentsStatusFilter: 'ALL',
      studentsLoading: false,
      studentsLoaded: false,
      showStudentModal: false,
      editingStudent: null,
      showBatchModal: false,
      reconciliationData: null,
      reconciliationRawText: '',
      reconciliationLoading: false,
      reconciliationFilter: 'ALL',
      reconciliationDate: new Date().toISOString().split('T')[0],
      reconciliationMessage: null,
      batchPreviewRecords: [],
      batchImporting: false,
      backupsData: null,
      loadingBackups: false,
      creatingBackup: false,
      restoringBackup: false,
      timeSimulationData: null,
      loadingTimeSimulation: false,
      showTimeMachineModal: false
    };

    function setAuth(token, user) {
      state.token = token;
      state.user = user;
      setStorageItem('cdnj_token', token);
      setStorageItem('cdnj_user', JSON.stringify(user));
      render();
    }

    function logout() {
      state.token = null;
      state.user = null;
      removeStorageItem('cdnj_token');
      removeStorageItem('cdnj_user');
      render();
    }

    function hasPermission(code) {
      if (!state.user) return false;
      const roles = Array.isArray(state.user.roles) ? state.user.roles : [];
      const perms = Array.isArray(state.user.permissions) ? state.user.permissions : [];
      if (roles.includes('SUPERADMIN') || perms.includes('*')) return true;
      return perms.includes(code);
    }

    async function loginDemo(username) {
      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password: '123456' })
        });
        const data = await res.json();
        if (res.ok) setAuth(data.token, data.user);
      } catch (e) { console.error(e); }
    }

    // Main Render Controller
    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      try {
        if (!state.user) {
          app.innerHTML = renderLogin();
          try { if (typeof lucide !== 'undefined' && lucide && lucide.createIcons) lucide.createIcons(); } catch(e) {}
          return;
        }

        app.innerHTML = `
          <div class="app-container">
            <!-- Sidebar -->
            <aside class="sidebar">
              <div>
                <div style="font-size:0.75rem; font-weight:700; color:#6b7280; text-transform:uppercase; margin-bottom:0.75rem; padding-left:0.5rem;">Módulo 1: Cobros</div>
                <nav style="display:flex; flex-direction:column; gap:0.4rem;">
                  ${hasPermission('payments:cashier:create_payment') ? `
                    <button onclick="state.activeTab='cashier'; render();" class="btn ${state.activeTab === 'cashier' ? 'btn-primary' : 'btn-secondary'}" style="justify-content:flex-start;">
                      <i data-lucide="credit-card"></i> Panel de Cobro
                    </button>
                  ` : ''}
                  ${hasPermission('payments:admin:view_history') ? `
                    <button onclick="state.activeTab='admin'; loadAdminDashboard();" class="btn ${state.activeTab === 'admin' ? 'btn-primary' : 'btn-secondary'}" style="justify-content:flex-start;">
                      <i data-lucide="layout-dashboard"></i> Dashboard & Supervisión
                    </button>
                  ` : ''}
                  ${hasPermission('payments:config:manage_rates') ? `
                    <button onclick="state.activeTab='rates'; loadRatesData();" class="btn ${state.activeTab === 'rates' ? 'btn-primary' : 'btn-secondary'}" style="justify-content:flex-start;">
                      <i data-lucide="settings"></i> Config. Aranceles
                    </button>
                  ` : ''}
                  ${hasPermission('payments:cashier:create_payment') ? `
                    <button onclick="state.activeTab='reconciliation'; loadDailyReconciliationData();" class="btn ${state.activeTab === 'reconciliation' ? 'btn-primary' : 'btn-secondary'}" style="justify-content:flex-start;">
                      <i data-lucide="check-square"></i> Conciliación Bancaria
                    </button>
                  ` : ''}
                  ${hasPermission('payments:admin:view_history') ? `
                    <button onclick="state.activeTab='students'; loadStudentsData();" class="btn ${state.activeTab === 'students' ? 'btn-primary' : 'btn-secondary'}" style="justify-content:flex-start;">
                      <i data-lucide="user-check"></i> Matrícula & Estudiantes
                    </button>
                  ` : ''}
                  ${(state.reEnrollmentEnabled || (state.user?.roles && state.user.roles.includes('SUPERADMIN'))) ? `
                    <button onclick="state.activeTab='reenrollment'; loadReEnrollmentData();" class="btn ${state.activeTab === 'reenrollment' ? 'btn-primary' : 'btn-secondary'}" style="justify-content:flex-start;">
                      <i data-lucide="calendar-plus"></i> Re-Inscripción 2027-2028
                      ${state.user?.roles && state.user.roles.includes('SUPERADMIN') ? '<span style="font-size:0.6rem; background:rgba(239,68,68,0.2); color:#f87171; padding:2px 5px; border-radius:4px; margin-left:auto;">SA</span>' : ''}
                    </button>
                  ` : ''}
                  ${(state.user?.roles && state.user.roles.includes('SUPERADMIN')) ? `
                    <button onclick="state.activeTab='backups'; loadBackupsData();" class="btn ${state.activeTab === 'backups' ? 'btn-primary' : 'btn-secondary'}" style="justify-content:flex-start;">
                      <i data-lucide="database"></i> Respaldo & BD
                      <span style="font-size:0.6rem; background:rgba(239,68,68,0.2); color:#f87171; padding:2px 5px; border-radius:4px; margin-left:auto;">SA</span>
                    </button>
                    <button onclick="state.activeTab='users'; loadUsersData();" class="btn ${state.activeTab === 'users' ? 'btn-primary' : 'btn-secondary'}" style="justify-content:flex-start;">
                      <i data-lucide="users"></i> Usuarios & Claves
                      <span style="font-size:0.6rem; background:rgba(239,68,68,0.2); color:#f87171; padding:2px 5px; border-radius:4px; margin-left:auto;">SA</span>
                    </button>
                  ` : ''}
                </nav>
              </div>
              <div>
                <div style="font-size:0.75rem; font-weight:700; color:#6b7280; text-transform:uppercase; margin-bottom:0.75rem; padding-left:0.5rem;">Próximos Módulos</div>
                <div style="display:flex; flex-direction:column; gap:0.4rem; opacity:0.5;">
                  <div class="glass-card" style="padding:0.6rem; display:flex; justify-content:space-between; font-size:0.85rem;">
                    <span><i data-lucide="graduation-cap"></i> Calificaciones</span> <i data-lucide="lock"></i>
                  </div>
                  <div class="glass-card" style="padding:0.6rem; display:flex; justify-content:space-between; font-size:0.85rem;">
                    <span><i data-lucide="users"></i> Matrículas</span> <i data-lucide="lock"></i>
                  </div>
                </div>
              </div>
            </aside>

            <!-- Main Body -->
            <div class="main-content">
              <!-- Navbar -->
              <header class="navbar">
                <div style="display:flex; align-items:center; gap:0.75rem;">
                  <div style="width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg, #6366f1, #10b981); display:flex; align-items:center; justify-content:center;">
                    <i data-lucide="shield-check" color="#fff"></i>
                  </div>
                  <div>
                    <h1 style="font-size:1.1rem; font-weight:700;">CDNJ Modular</h1>
                    <span style="font-size:0.75rem; color:#9ca3af;">Gestión Escolar RBAC</span>
                  </div>
                </div>

                <!-- Quick Demo Switcher & Time Machine -->
                <div style="display:flex; align-items:center; gap:0.6rem;">
                  <div style="display:flex; align-items:center; gap:0.4rem; background:rgba(11,15,25,0.7); padding:0.3rem 0.6rem; border-radius:9999px; border:1px solid rgba(255,255,255,0.1);">
                    <span style="font-size:0.75rem; color:#9ca3af; font-weight:600;">Rol Demo:</span>
                    <button onclick="loginDemo('cajera')" class="btn btn-sm ${state.user?.username==='cajera'?'btn-accent':'btn-secondary'}" style="padding:0.15rem 0.5rem;">Cajera</button>
                    <button onclick="loginDemo('admin')" class="btn btn-sm ${state.user?.username==='admin'?'btn-primary':'btn-secondary'}" style="padding:0.15rem 0.5rem;">Admin</button>
                    <button onclick="loginDemo('superadmin')" class="btn btn-sm ${state.user?.username==='superadmin'?'btn-primary':'btn-secondary'}" style="padding:0.15rem 0.5rem; background:${state.user?.username==='superadmin'?'#8b5cf6':''};">Superadmin</button>
                  </div>

                  <!-- Time Machine Control Widget -->
                  <div style="display:flex; align-items:center; gap:0.4rem; background:${state.timeSimulationData?.isSimulated ? 'rgba(234,179,8,0.15)' : 'rgba(99,102,241,0.15)'}; padding:0.3rem 0.65rem; border-radius:9999px; border:1px solid ${state.timeSimulationData?.isSimulated ? 'rgba(234,179,8,0.5)' : 'rgba(99,102,241,0.3)'};">
                    <i data-lucide="clock" size="15" color="${state.timeSimulationData?.isSimulated ? '#facc15' : '#818cf8'}"></i>
                    <span style="font-size:0.725rem; color:${state.timeSimulationData?.isSimulated ? '#facc15' : '#e0e7ff'}; font-weight:700;">
                      ${state.timeSimulationData?.isSimulated ? `⏰ ${state.timeSimulationData.simulatedDateFormatted.split(' - ')[0]}` : `⏰ Reloj Real`}
                    </span>
                    <button onclick="state.showTimeMachineModal = true; render();" class="btn btn-sm" style="padding:0.15rem 0.45rem; font-size:0.7rem; background:${state.timeSimulationData?.isSimulated ? '#eab308' : '#6366f1'}; color:#fff; border:none; border-radius:6px; cursor:pointer;" title="Abrir Control Temporal">
                      <i data-lucide="fast-forward" size="12"></i> Máquina del Tiempo
                    </button>
                    ${state.timeSimulationData?.isSimulated ? `
                      <button onclick="resetTimeSimulation();" class="btn btn-sm" style="padding:0.15rem 0.35rem; font-size:0.65rem; background:rgba(239,68,68,0.2); color:#f87171; border:1px solid rgba(239,68,68,0.4); border-radius:6px; cursor:pointer;" title="Restablecer a Tiempo Real">
                        <i data-lucide="rotate-ccw" size="12"></i>
                      </button>
                    ` : ''}
                  </div>
                </div>

                <div style="display:flex; align-items:center; gap:1rem;">
                  <div style="text-align:right;">
                    <div style="font-size:0.875rem; font-weight:600;">${state.user?.fullName || state.user?.username || 'Usuario'}</div>
                    <span class="badge badge-primary">${(state.user?.roles || []).join(', ')}</span>
                  </div>
                  <button onclick="logout()" class="btn btn-sm" style="display:inline-flex; align-items:center; gap:0.4rem; background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.4); padding:0.35rem 0.75rem; border-radius:8px; font-weight:600; font-size:0.8rem; cursor:pointer; transition:all 0.2s;" title="Cerrar Sesión">
                    <i data-lucide="log-out" size="16"></i>
                    <span>Salir</span>
                  </button>
                </div>
              </header>

              ${state.timeSimulationData?.isSimulated ? `
                <div style="background:linear-gradient(90deg, rgba(234,179,8,0.25), rgba(245,158,11,0.25)); border-bottom:1px solid rgba(234,179,8,0.4); padding:0.5rem 1.5rem; display:flex; align-items:center; justify-content:space-between; font-size:0.825rem; color:#fef08a; flex-wrap:wrap; gap:0.5rem;">
                  <div style="display:flex; align-items:center; gap:0.5rem;">
                    <i data-lucide="alert-triangle" size="18" color="#facc15"></i>
                    <span><strong>MODO SIMULACIÓN TEMPORAL ACTIVO:</strong> Operando en la fecha simulada <strong>${state.timeSimulationData.simulatedDateFormatted}</strong>.</span>
                  </div>
                  <div style="display:flex; gap:0.5rem; align-items:center;">

    async function handleLoginForm(e) {
      e.preventDefault();
      const u = document.getElementById('login_user').value;
      const p = document.getElementById('login_pass').value;
      const errBox = document.getElementById('login_error_box');
      const btn = document.getElementById('btn_submit_login');
      
      if (btn) btn.innerText = 'Ingresando...';
      if (errBox) errBox.innerHTML = '';

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok) {
          setAuth(data.token, data.user);
        } else {
          if (errBox) errBox.innerHTML = `<span style="color:#ef4444;">${data.message || 'Credenciales incorrectas'}</span>`;
          if (btn) btn.innerText = 'Acceder al Sistema';
        }
      } catch (err) {
        console.error(err);
        if (errBox) errBox.innerHTML = `<span style="color:#ef4444;">Error de conexión con el servidor REST (${API_BASE || 'http://localhost:3000'}).</span>`;
        if (btn) btn.innerText = 'Acceder al Sistema';
      }
    }

                  <div style="font-size:0.95rem; font-weight:800; color:${state.isPartial ? '#fbbf24' : '#e5e7eb'}; display:flex; align-items:center; justify-content:center; gap:0.4rem;">

                    <span>Monto a Abonar Hoy: <strong id="display_abono_usd" style="color:#fbbf24;">$${(state.partialAmountUSD || 0).toFixed(2)} USD</strong> (<span id="display_abono_ves" style="color:#f3f4f6;">${((state.partialAmountUSD || 0) * state.exchangeRate).toLocaleString('es-VE', {minimumFractionDigits:2})} VES</span>)</span>
                    <span>Deuda Restante Pendiente: <strong id="display_remaining_usd" style="color:#f87171;">$${Math.max(0, totalUSD - (state.partialAmountUSD || 0)).toFixed(2)} USD</strong></span>

              <!-- Resumen Total a Cobrar -->

                <div>
                  <span style="font-size:0.75rem; color:#9ca3af;">Monto a Procesar (USD):</span>
                  <h2 id="display_proc_usd" style="color:${state.isPartial ? '#fbbf24' : '#34d399'}; font-size:1.6rem;">$${(state.isPartial ? (state.partialAmountUSD || 0) : totalUSD).toFixed(2)} USD</h2>
                </div>
                <div style="text-align:right;">
                  <span style="font-size:0.75rem; color:#9ca3af;">Tasa Ref: ${state.exchangeRate.toFixed(2)} VES</span>
                  <div id="display_proc_ves" style="font-size:1.1rem; font-weight:700;">${((state.isPartial ? (state.partialAmountUSD || 0) : totalUSD) * state.exchangeRate).toLocaleString('es-VE', {minimumFractionDigits:2})} VES</div>
                </div>
              </div>

              <button onclick="openPaymentConfirmModal()" class="btn ${state.isPartial ? 'btn-warning' : 'btn-accent'}" style="width:100%; font-size:1rem; padding:0.85rem;" ${totalUSD===0?'disabled':''}>
                <span id="display_btn_text">${state.isPartial ? `Confirmar Abono Parcial ($${(state.partialAmountUSD || 0).toFixed(2)} USD)` : `Confirmar Pago Total ($${totalUSD.toFixed(2)} USD)`}</span>

    function setSearchMode(mode) {
      state.searchMode = mode;
      let defaultVal = '';
      if (mode === 'rep') defaultVal = 'REP-';
      else if (mode === 'est') defaultVal = 'EST-2026-';
      else if (mode === 'cedula') defaultVal = 'V-';
      state.searchQuery = defaultVal;
      render();

      setTimeout(() => {
        const inp = document.getElementById('search_input');
        if (inp) {
          inp.focus();
          inp.setSelectionRange(defaultVal.length, defaultVal.length);
        }
      }, 50);
    }

    function handleSearchInput(e) {
      let val = e.target.value;
      if (state.searchMode === 'rep') {
        if (!val.toUpperCase().startsWith('REP-')) {
          const digits = val.replace(/\D/g, '');
          val = digits ? 'REP-' + digits.padStart(3, '0') : 'REP-';
          e.target.value = val;
        }
      } else if (state.searchMode === 'est') {
        if (!val.toUpperCase().startsWith('EST-2026-')) {
          const digits = val.replace(/\D/g, '');
          val = digits ? 'EST-2026-' + digits.padStart(4, '0') : 'EST-2026-';
          e.target.value = val;
        }
      } else if (state.searchMode === 'cedula') {
        if (!val.toUpperCase().startsWith('V-') && !val.toUpperCase().startsWith('CE-')) {
          const digits = val.replace(/\D/g, '');
          val = digits ? 'V-' + digits : 'V-';
          e.target.value = val;
        }
      }
      state.searchQuery = e.target.value;
    }

    async function handleSearch(e) {
      e.preventDefault();
      const q = document.getElementById('search_input').value.trim();
      state.searchQuery = q;
      if (!q) return;

      const res = await fetch(`${API_BASE}/api/payments/students/search?q=${encodeURIComponent(q)}`, {
        headers: { Authorization: `Bearer ${state.token}` }
      });
      const results = await res.json();
      state.searchResults = results;

      if (results && results.length > 0) {
        const firstGuardian = results[0].guardians && results[0].guardians[0]?.guardian;
        const allSameGuardian = firstGuardian && results.every(s => s.guardians && s.guardians[0]?.guardian?.guardianCode === firstGuardian.guardianCode);

        // Si se busca por representante o los resultados pertenecen al mismo tutor:
        // Desplegar automáticamente la Deuda Consolidada del Representante SIN seleccionar a ningún representado individual
        if (state.searchMode === 'rep' || allSameGuardian || q.toUpperCase().includes('REP-')) {
          selectRepresentativeGlobal(results[0].id);
          return;
        }
      } else {
        state.familyData = null;
        state.selectedStudent = null;
        state.debts = [];
      }
      render();
    }

    async function selectRepresentativeGlobal(id) {
      const res = await fetch(`${API_BASE}/api/payments/students/${id}/family-debts`, {
        headers: { Authorization: `Bearer ${state.token}` }
      });
      const data = await res.json();
      state.familyData = data;
      state.exchangeRate = data.exchangeRate || 36.50;

      let allDebts = [];
      if (data.students) {
        data.students.forEach(st => {
          st.debts.forEach(d => {
            allDebts.push({
              ...d,
              studentId: st.id,
              studentName: `${st.firstName} ${st.lastName}`,
              studentCode: st.studentCode,
              grade: st.grade
            });
          });
        });
      }
      state.allFamilyDebts = allDebts;
      state.debts = allDebts;
      state.selectedDebtIds = allDebts.map(d => d.id);
      state.selectedStudent = null; // IMPORTANTE: NO se selecciona ningún representado individual
      state.isPartial = false;
      state.partialAmountUSD = 0;
      render();
    }

    async function selectStudent(id, targetStudentId = null) {
      const res = await fetch(`${API_BASE}/api/payments/students/${id}/family-debts`, {
        headers: { Authorization: `Bearer ${state.token}` }
      });
      const data = await res.json();
      state.familyData = data;
      state.exchangeRate = data.exchangeRate || 36.50;

      let allDebts = [];
      if (data.students) {
        data.students.forEach(st => {
          st.debts.forEach(d => {
            allDebts.push({
              ...d,
              studentId: st.id,
              studentName: `${st.firstName} ${st.lastName}`,
              studentCode: st.studentCode,
              grade: st.grade
            });
          });
        });
      }
      state.allFamilyDebts = allDebts;

      if (targetStudentId === 'ALL') {
        state.selectedStudent = null;
        state.debts = allDebts;
      } else if (targetStudentId) {
        const st = data.students.find(s => s.id === targetStudentId);
        state.selectedStudent = st || null;
        state.debts = st ? st.debts.map(d => ({
          ...d,
          studentId: st.id,
          studentName: `${st.firstName} ${st.lastName}`,
          studentCode: st.studentCode,
          grade: st.grade
        })) : allDebts;
      } else if (data.representedCount > 1) {
        state.selectedStudent = null;
        state.debts = allDebts;
      } else {
        state.selectedStudent = data.students?.[0] || null;
        state.debts = allDebts;
      }

      state.debts = sortDebtsByHierarchy(state.debts);
      state.selectedDebtIds = state.debts.map(d => d.id);
      state.isPartial = false;
      state.partialAmountUSD = 0;
      render();
    }

    function selectIndividualStudent(studentId) {
      if (studentId === 'ALL') {
        state.selectedStudent = null;
        state.debts = state.allFamilyDebts;
      } else {
        const st = state.familyData.students.find(s => s.id === studentId);

    function sortDebtsByHierarchy(debts) {
      if (!Array.isArray(debts)) return [];
      return [...debts].sort((a, b) => {
        const codeA = ((a.feeConcept?.code || a.code || '')).toUpperCase();
        const nameA = ((a.feeConcept?.name || a.name || '')).toUpperCase();
        const dueA = a.dueDate || a.due_date || '';

        const codeB = ((b.feeConcept?.code || b.code || '')).toUpperCase();
        const nameB = ((b.feeConcept?.name || b.name || '')).toUpperCase();
        const dueB = b.dueDate || b.due_date || '';

        let yearA = 2026;
        if (codeA.includes('2027-2028') || codeA.includes('2027_2028') || codeA.includes('2028')) yearA = 2027;
        else if (codeA.includes('2026-2027') || codeA.includes('2026_2027') || codeA.includes('2026')) yearA = 2026;
        else if (dueA && dueA.length >= 4) yearA = parseInt(dueA.substring(0, 4)) || 2026;

        let yearB = 2026;
        if (codeB.includes('2027-2028') || codeB.includes('2027_2028') || codeB.includes('2028')) yearB = 2027;
        else if (codeB.includes('2026-2027') || codeB.includes('2026_2027') || codeB.includes('2026')) yearB = 2026;
        else if (dueB && dueB.length >= 4) yearB = parseInt(dueB.substring(0, 4)) || 2026;

        if (yearA !== yearB) return yearA - yearB;

        const isMatA = codeA.startsWith('MAT') || codeA.startsWith('INS') || nameA.includes('MATRÍCULA') || nameA.includes('INSCRIPCIÓN');
        const isMatB = codeB.startsWith('MAT') || codeB.startsWith('INS') || nameB.includes('MATRÍCULA') || nameB.includes('INSCRIPCIÓN');

        const rankA = isMatA ? 0 : 1;
        const rankB = isMatB ? 0 : 1;

        if (rankA !== rankB) return rankA - rankB;

        if (dueA !== dueB) return dueA.localeCompare(dueB);

        return String(a.id || '').localeCompare(String(b.id || ''));
      });
    }

    function toggleDebt(id) {
      const sortedDebts = sortDebtsByHierarchy(state.debts);
      const idx = sortedDebts.findIndex(d => d.id === id);
      if (idx === -1) return;

      const isSelected = state.selectedDebtIds.includes(id);

      if (isSelected) {
        // Unselect this debt and all newer debts (from idx to end)
        const unselectIds = sortedDebts.slice(idx).map(d => d.id);
        state.selectedDebtIds = state.selectedDebtIds.filter(i => !unselectIds.includes(i));
      } else {
        // Select this debt and all older debts (from 0 to idx)
        const selectIds = sortedDebts.slice(0, idx + 1).map(d => d.id);
        const set = new Set([...state.selectedDebtIds, ...selectIds]);
        state.selectedDebtIds = Array.from(set);
      }
      render();
    }

    function setPaymentType(isPartial) {
      state.isPartial = isPartial;
      const totalUSD = state.debts.filter(d => state.selectedDebtIds.includes(d.id)).reduce((s, d) => s + d.amountUSD, 0);
      if (isPartial) {
        if (!state.partialAmountUSD || state.partialAmountUSD <= 0 || state.partialAmountUSD >= totalUSD) {
          state.partialAmountUSD = Number((totalUSD / 2).toFixed(2));
        }
      } else {
        state.partialAmountUSD = 0;
      }
      render();
    }

    function setPresetPartial(pct) {
      const totalUSD = state.debts.filter(d => state.selectedDebtIds.includes(d.id)).reduce((s, d) => s + d.amountUSD, 0);

    function handlePartialUSDInput(e) {

      if (inputVES) {

    function handlePartialVESInput(e) {

      const rate = state.exchangeRate || 36.50;
      const valUSD = Number((valVES / rate).toFixed(2));

    function updatePartialDisplayLabels() {
      const valUSD = state.partialAmountUSD || 0;

      const valVES = valUSD * rate;

      const totalUSD = state.debts.filter(d => state.selectedDebtIds.includes(d.id)).reduce((s, d) => s + d.amountUSD, 0);
      const remaining = Math.max(0, totalUSD - valUSD);

      const displayProcUSD = document.getElementById('display_proc_usd');
      const displayProcVES = document.getElementById('display_proc_ves');
      const displayBtnText = document.getElementById('display_btn_text');
      const displayRemaining = document.getElementById('display_remaining_usd');
      const displayAbonoUSD = document.getElementById('display_abono_usd');
      const displayAbonoVES = document.getElementById('display_abono_ves');

      if (displayProcUSD) displayProcUSD.innerText = `$${valUSD.toFixed(2)} USD`;
      if (displayProcVES) displayProcVES.innerText = `${valVES.toLocaleString('es-VE', {minimumFractionDigits:2, maximumFractionDigits:2})} VES`;
      if (displayBtnText) displayBtnText.innerText = `Confirmar Abono Parcial ($${valUSD.toFixed(2)} USD)`;
      if (displayRemaining) displayRemaining.innerText = `$${remaining.toFixed(2)} USD`;
      if (displayAbonoUSD) displayAbonoUSD.innerText = `$${valUSD.toFixed(2)} USD`;

    async function confirmAndProcessPayment() {
      const totalUSD = state.debts.filter(d => state.selectedDebtIds.includes(d.id)).reduce((s, d) => s + d.amountUSD, 0);
      const amountUSD = state.isPartial ? state.partialAmountUSD : totalUSD;

      if (amountUSD <= 0) {
        state.paymentModalError = 'Por favor ingresa un monto válido a pagar.';
        render();
        return;
      }

      const method = state.paymentMethod;
      const curr = state.paymentCurrency;
      const ref = (state.paymentReference || '').trim();
      const bank = (state.paymentBank || '').trim();

      if (curr === 'VES') {
        if (method === 'PAGO_MOVIL' || method === 'TRANSFER_VES' || method === 'PUNTO_VENTA') {
          if (!ref || ref.length !== 5 || !/^\d{5}$/.test(ref)) {
            state.paymentModalError = 'Debe ingresar exactamente los últimos 5 dígitos del comprobante / referencia.';
            render();
            return;
          }
        }

        if (method === 'PAGO_MOVIL' || method === 'TRANSFER_VES') {
          const validBanks = ['VENEZUELA', 'BANESCO', 'BANCA AMIGA', 'MERCANTIL', 'PROVINCIAL'];
          if (!bank || !validBanks.includes(bank)) {
            state.paymentModalError = 'Debe seleccionar el banco de destino (VENEZUELA, BANESCO, BANCA AMIGA, MERCANTIL, PROVINCIAL).';
            render();
            return;
          }
        }
      }

      let methodsObj = [];
      if (curr === 'USD') {
        methodsObj = [{
          method: 'CASH_USD',
          amount: amountUSD,
          currency: 'USD'
        }];
      } else {
        const amountVES = Number((amountUSD * state.exchangeRate).toFixed(2));
        methodsObj = [{
          method: method,
          amount: amountVES,
          currency: 'VES',
          reference: ref || null,
          bank: bank || null
        }];
      }

      const activeStudentId = state.selectedStudent ? state.selectedStudent.id : (state.familyData?.students[0]?.id || '');

      try {
        const selectedDebtsObjs = state.debts.filter(d => state.selectedDebtIds.includes(d.id));
        const isEnrollmentPayment = selectedDebtsObjs.some(d => (d.feeConcept?.code || d.code || '').startsWith('MAT-') || (d.feeConcept?.name || d.name || '').toLowerCase().includes('matrícula') || (d.feeConcept?.name || d.name || '').toLowerCase().includes('inscripción'));

        const reEnrollmentData = {};
        if (isEnrollmentPayment && state.selectedStudent?.id) {
          const nextGrade = document.getElementById('re_next_grade')?.value || '1er Grado';
          const nextSection = document.getElementById('re_next_section')?.value || 'A';
          const promotedStatus = document.querySelector('input[name="re_promoted_status"]:checked')?.value || 'PROMOTED';
          reEnrollmentData[state.selectedStudent.id] = { nextGrade, nextSection, promotedStatus };
        }

        const res = await fetch(`${API_BASE}/api/payments/transactions`, {
          method: 'POST',
          headers: { 'Content-Type':'application/json', Authorization: `Bearer ${state.token}` },
          body: JSON.stringify({
            studentId: activeStudentId,
            selectedDebtIds: state.selectedDebtIds,
            isPartial: state.isPartial,
            partialAmountUSD: state.partialAmountUSD,
            methods: methodsObj,
            exchangeRate: state.exchangeRate,
            reEnrollmentData: reEnrollmentData
          })
        });
        const data = await res.json();
        if (res.ok) {
          state.showPaymentConfirmModal = false;
          if (data.paperCheckRequired) {
            state.showPaperCheckModal = true;
            state.pendingPaperCheckNumber = data.paperNumber;
            state.showPaperDiscrepancyInput = false;
          }
          openReceiptModal(data.id);
          state.selectedStudent = null;
          state.familyData = null;
          state.debts = [];
          state.isPartial = false;
          state.partialAmountUSD = 0;
          loadPaperControlData();
          render();
        } else {
          state.paymentModalError = data.message || 'Error al procesar el pago';
          render();
        }
      } catch (e) {
        state.paymentModalError = 'Error de comunicación con el servidor.';
        render();
      }
    }

    // Admin Dashboard & History Panel
    async function loadAdminDashboard(period = null) {
      if (period) state.dashboardPeriod = period;
      if (!state.dashboardPeriod) state.dashboardPeriod = 'daily';
      state.dashboardLoading = true;
      render();
      try {
        const [dashRes, txRes] = await Promise.all([
          fetch(`${API_BASE}/api/payments/dashboard-summary?period=${state.dashboardPeriod}`, {
            headers: { Authorization: `Bearer ${state.token}` }
          }),
          fetch(`${API_BASE}/api/payments/transactions`, {
            headers: { Authorization: `Bearer ${state.token}` }
          })
        ]);
        if (dashRes.ok) {
          state.dashboardData = await dashRes.json();
        }
        if (txRes.ok) {
          const txData = await txRes.json();
          state.transactions = txData.transactions || [];
        }
      } catch (err) {
        console.error('Error al cargar dashboard de administración:', err);
      } finally {
        state.dashboardLoading = false;
        render();
      }
    }

    async function loadTransactions() {
      return loadAdminDashboard();
    }

      state.activeTab = 'cashier';
      render();
      await selectRepresentativeGlobal(repId);
    }

    async function confirmVoid() {
      const reason = document.getElementById('void_reason')?.value;
      if (!reason || reason.trim().length < 5) {
        alert('Por favor ingrese un motivo detallado (mínimo 5 caracteres).');
        return;
      }

      const targetVoidId = state.showVoidModal;
      const res = await fetch(`${API_BASE}/api/payments/transactions/${targetVoidId}/void`, {
        method: 'POST',
        headers: {'Content-Type':'application/json', Authorization: `Bearer ${state.token}`},
        body: JSON.stringify({ reason })
      });
      if(res.ok) {
        state.showVoidModal = null;
        alert('✅ Recibo anulado auditadamente y deudas restablecidas.');
        if (state.showPaperBatchModal) {
          await loadPaperBatchData(state.paperBatchSearch);
        }
        if (state.activeReceiptModalId === targetVoidId) {
          await openReceiptModal(targetVoidId);
        }
        await loadTransactions();
        render();
      } else {
        const d = await res.json();
        alert('⚠️ ' + (d.message || 'Error al anular'));
      }
    }

    async function openReceiptModal(id) {
      state.activeReceiptModalId = id;
      state.activeReceiptData = null;

      render();
      try {

          headers: { Authorization: `Bearer ${state.token}` }

        const data = await res.json();
        state.activeReceiptData = data;

                    <span class="badge" style="background:rgba(168,85,247,0.25); color:#c084fc; border:1px solid #c084fc; font-size:0.65rem; margin-left:0.3rem;">Beca ${data.student.scholarshipPct}%</span>
                  ` : ''}
                </div>
              </div>

              <!-- Selector de Representados / Hermanos (si hay más de 1 en la familia) -->
              ${state.familyData?.students && state.familyData.students.length > 1 ? `
                <div style="background:rgba(99, 102, 241, 0.08); border:1px solid rgba(99, 102, 241, 0.25); border-radius:10px; padding:0.75rem 1rem; margin-bottom:1rem;">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem; flex-wrap:wrap; gap:0.3rem;">
                    <span style="font-size:0.75rem; font-weight:700; color:#818cf8; text-transform:uppercase;">Cambiar Representado:</span>
                    <label style="font-size:0.8rem; font-weight:700; color:#fbbf24; cursor:pointer; display:flex; align-items:center; gap:0.4rem;">
                      <input type="checkbox" ${state.advanceApplyToAllSiblings ? 'checked' : ''} onchange="state.advanceApplyToAllSiblings = this.checked; render();" style="accent-color:#f59e0b;">
                      👨‍👩‍👧‍👦 Aplicar mismos meses a todos los hermanos (${state.familyData.students.length} estudiantes)
                    </label>
                  </div>
                  <div style="display:flex; gap:0.4rem; overflow-x:auto; padding-bottom:0.25rem;">
                    ${state.familyData.students.map(st => `
                      <button type="button" onclick="switchAdvanceStudent('${st.id}')" class="btn btn-sm ${st.id === state.advanceModalStudentId ? 'btn-primary' : 'btn-secondary'}" style="font-size:0.75rem; padding:0.3rem 0.6rem; white-space:nowrap;">
                        🎓 ${st.firstName} (${st.grade})
                      </button>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <!-- Botones de Selección Rápida -->
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; flex-wrap:wrap; gap:0.4rem;">
                <span style="font-size:0.8rem; font-weight:700; color:#9ca3af; text-transform:uppercase;">Selecciona los meses a adelantar (Año ${data.schoolYear}):</span>
                <div style="display:flex; gap:0.35rem; flex-wrap:wrap;">
                  <button type="button" onclick="selectAdvancePreset('next')" class="btn btn-sm btn-secondary" style="font-size:0.72rem; padding:0.2rem 0.55rem;">+1 Mes Próximo</button>
                  <button type="button" onclick="selectAdvancePreset('3months')" class="btn btn-sm btn-secondary" style="font-size:0.72rem; padding:0.2rem 0.55rem;">+3 Meses</button>
                  <button type="button" onclick="selectAdvancePreset('all')" class="btn btn-sm btn-secondary" style="font-size:0.72rem; padding:0.2rem 0.55rem;">Resto del Año</button>
                  <button type="button" onclick="selectAdvancePreset('none')" class="btn btn-sm btn-secondary" style="font-size:0.72rem; padding:0.2rem 0.55rem; color:#9ca3af;">Deseleccionar</button>
                </div>
              </div>

              <!-- Lista de Meses Futuros Disponibles -->
              ${data.unbilledMonths && data.unbilledMonths.length > 0 ? `
                <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap:0.6rem; max-height:240px; overflow-y:auto; padding-right:0.3rem; margin-bottom:1rem;">
                  ${data.unbilledMonths.map(m => {
                    const key = `${m.year}-${m.month}`;
                    const isSelected = state.advanceSelectedMonths.includes(key);
                    return `
                      <div onclick="toggleAdvanceMonth('${key}')" style="background:${isSelected ? 'rgba(245, 158, 11, 0.15)' : 'rgba(255,255,255,0.02)'}; border:2px solid ${isSelected ? '#f59e0b' : 'rgba(255,255,255,0.08)'}; border-radius:8px; padding:0.65rem 0.8rem; cursor:pointer; transition:all 0.15s ease; display:flex; align-items:center; gap:0.6rem;">
                        <input type="checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleAdvanceMonth('${key}')" style="accent-color:#f59e0b; width:16px; height:16px; cursor:pointer;">
                        <div style="flex:1;">
                          <div style="font-weight:700; color:${isSelected ? '#fbbf24' : '#f3f4f6'}; font-size:0.875rem;">${m.monthName} ${m.year}</div>
                          <div style="font-size:0.72rem; color:#9ca3af;">Vence: ${m.dueDate}</div>
                        </div>
                        <div style="text-align:right;">
                          <strong style="color:#34d399; font-size:0.85rem;">$${m.amountUSD.toFixed(2)}</strong>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : `
                <div style="text-align:center; padding:2rem 1rem; background:rgba(16,185,129,0.05); border:1px dashed rgba(16,185,129,0.3); border-radius:10px; margin-bottom:1rem;">
                  <div style="font-size:1.8rem; margin-bottom:0.4rem;">🎓</div>
                  <strong style="color:#34d399; font-size:0.95rem;">Todos los meses del año escolar ${data.schoolYear} ya están facturados o cancelados.</strong>
                  <p style="color:#9ca3af; font-size:0.8rem; margin:0.3rem 0 0 0;">No hay meses futuros pendientes por programar en este período.</p>
                </div>
              `}

              <!-- Resumen de Totales -->
              ${(() => {
                const countMonths = state.advanceSelectedMonths.length;
                const studentMultiplier = (state.advanceApplyToAllSiblings && state.familyData?.students) ? state.familyData.students.length : 1;
                const totalDebts = countMonths * studentMultiplier;
                const feePerMonth = data.student.finalMonthlyUSD;
                const totalUSD = countMonths * feePerMonth * studentMultiplier;
                const totalVES = totalUSD * state.exchangeRate;

                return `
                  <div style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:0.85rem 1rem; margin-bottom:1.25rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
                    <div>
                      <div style="font-size:0.75rem; color:#9ca3af; text-transform:uppercase; font-weight:700;">Resumen del Adelanto:</div>
                      <div style="font-size:0.9rem; color:#f3f4f6;">
                        <strong>${countMonths} mes(es)</strong> seleccionado(s)
                        ${studentMultiplier > 1 ? `<span style="color:#818cf8; font-weight:700;"> x ${studentMultiplier} representados = ${totalDebts} cuotas</span>` : ''}
                      </div>
                    </div>
                    <div style="text-align:right;">
                      <div style="font-size:0.75rem; color:#9ca3af; text-transform:uppercase; font-weight:700;">Monto Total a Añadir a Caja:</div>
                      <div style="display:flex; align-items:baseline; justify-content:flex-end; gap:0.5rem;">
                        <strong style="font-size:1.3rem; color:#fbbf24;">$${totalUSD.toFixed(2)} USD</strong>
                        <span style="font-size:0.85rem; color:#9ca3af;">(~Bs. ${totalVES.toLocaleString('es-VE', {minimumFractionDigits:2, maximumFractionDigits:2})})</span>
                      </div>
                    </div>
                  </div>

                  <!-- Botones de Acción -->
                  <div style="display:flex; justify-content:flex-end; gap:0.6rem;">
                    <button type="button" onclick="closeAdvancePaymentModal()" class="btn btn-secondary" style="padding:0.65rem 1.25rem;">
                      Cancelar
                    </button>
                    <button type="button" onclick="submitAdvanceTuition()" class="btn btn-primary" ${countMonths === 0 ? 'disabled' : ''} style="display:inline-flex; align-items:center; gap:0.5rem; background:linear-gradient(135deg, #f59e0b, #d97706); border:none; padding:0.65rem 1.5rem; font-weight:800; font-size:0.95rem; opacity:${countMonths === 0 ? '0.5' : '1'}; cursor:${countMonths === 0 ? 'not-allowed' : 'pointer'}; box-shadow:0 4px 15px rgba(245, 158, 11, 0.35);">
                      <i data-lucide="check-circle-2"></i> ➕ Confirmar e Incluir en Caja (${totalDebts})
                    </button>
                  </div>
                `;
              })()}
            ` : ''}

          </div>
        </div>
      `;
    }

    async function openAdvancePaymentModal(studentId = null) {
      let targetId = studentId;
      if (!targetId && state.selectedStudent) {
        targetId = state.selectedStudent.id;
      } else if (!targetId && state.familyData?.students && state.familyData.students.length > 0) {
        targetId = state.familyData.students[0].id;
      }

      if (!targetId) {
        alert("⚠️ Por favor selecciona primero un alumno o representante para consultar las mensualidades a adelantar.");
        return;
      }

      state.showAdvanceModal = true;
      state.advanceModalStudentId = targetId;
      state.advanceModalLoading = true;
      state.advanceModalError = null;
      state.advanceSelectedMonths = [];
      state.advanceApplyToAllSiblings = false;
      render();

      try {
        const res = await fetch(`${API_BASE}/api/payments/students/${targetId}/advance-options`, {
          headers: { Authorization: `Bearer ${state.token}` }
        });
        const data = await res.json();
        if (res.ok) {
          state.advanceOptionsData = data;
          state.advanceModalLoading = false;
          // Pre-seleccionar automáticamente el próximo mes no facturado si existe
          if (data.unbilledMonths && data.unbilledMonths.length > 0) {
            state.advanceSelectedMonths = [`${data.unbilledMonths[0].year}-${data.unbilledMonths[0].month}`];
          }
          render();
        } else {
          state.advanceModalLoading = false;
          state.advanceModalError = data.message || "Error al cargar las opciones de mensualidades.";
          render();
        }
      } catch (err) {
        state.advanceModalLoading = false;
        state.advanceModalError = err.message || "Error de conexión con el servidor.";
        render();
      }
    }

    function closeAdvancePaymentModal() {
      state.showAdvanceModal = false;
      state.advanceOptionsData = null;
      state.advanceModalLoading = false;
      state.advanceModalError = null;
      state.advanceSelectedMonths = [];
      state.advanceApplyToAllSiblings = false;
      render();
    }

    async function switchAdvanceStudent(studentId) {
      if (state.advanceModalStudentId === studentId) return;
      state.advanceModalStudentId = studentId;
      state.advanceModalLoading = true;
      state.advanceModalError = null;
      state.advanceSelectedMonths = [];
      render();

      try {
        const res = await fetch(`${API_BASE}/api/payments/students/${studentId}/advance-options`, {
          headers: { Authorization: `Bearer ${state.token}` }
        });
        const data = await res.json();
        if (res.ok) {
          state.advanceOptionsData = data;
          state.advanceModalLoading = false;
          if (data.unbilledMonths && data.unbilledMonths.length > 0) {
            state.advanceSelectedMonths = [`${data.unbilledMonths[0].year}-${data.unbilledMonths[0].month}`];
          }
          render();
        } else {
          state.advanceModalLoading = false;
          state.advanceModalError = data.message || "Error al cargar las opciones.";
          render();
        }
      } catch (err) {
        state.advanceModalLoading = false;
        state.advanceModalError = err.message || "Error de conexión.";
        render();
      }
    }

    function toggleAdvanceMonth(monthKey) {
      const idx = state.advanceSelectedMonths.indexOf(monthKey);
      if (idx >= 0) {
        state.advanceSelectedMonths.splice(idx, 1);
      } else {
        state.advanceSelectedMonths.push(monthKey);
      }
      render();
    }

    function selectAdvancePreset(type) {
      if (!state.advanceOptionsData || !state.advanceOptionsData.unbilledMonths) return;
      const unbilled = state.advanceOptionsData.unbilledMonths;

      if (type === 'next') {
        state.advanceSelectedMonths = unbilled.length > 0 ? [`${unbilled[0].year}-${unbilled[0].month}`] : [];
      } else if (type === '3months') {
        state.advanceSelectedMonths = unbilled.slice(0, 3).map(m => `${m.year}-${m.month}`);
      } else if (type === 'all') {
        state.advanceSelectedMonths = unbilled.map(m => `${m.year}-${m.month}`);
      } else if (type === 'none') {
        state.advanceSelectedMonths = [];
      }
      render();
    }

    async function submitAdvanceTuition() {
      if (!state.advanceSelectedMonths || state.advanceSelectedMonths.length === 0) {
        alert("⚠️ Por favor selecciona al menos un mes a adelantar.");
        return;
      }

      const months = state.advanceSelectedMonths.map(k => {
        const parts = k.split('-');
        return { year: parseInt(parts[0]), month: parseInt(parts[1]) };
      });

      let studentIds = [state.advanceModalStudentId];
      if (state.advanceApplyToAllSiblings && state.familyData?.students && state.familyData.students.length > 1) {
        studentIds = state.familyData.students.map(s => s.id);
      }

      try {
        const res = await fetch(`${API_BASE}/api/payments/students/advance-tuition`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${state.token}`
          },
          body: JSON.stringify({ studentIds, months })
        });
        const data = await res.json();
        if (res.ok) {
          const createdDebts = data.createdDebts || [];
          closeAdvancePaymentModal();

          // Recargar deudas en caja
          const currentStudentId = state.selectedStudent ? state.selectedStudent.id : null;
          const rootStudentId = state.familyData?.students?.[0]?.id || state.advanceModalStudentId;

          await selectStudent(rootStudentId, currentStudentId);

          // Auto-seleccionar las deudas recién adelantadas
          const newDebtIds = createdDebts.map(d => d.id);
          state.selectedDebtIds = Array.from(new Set([...state.selectedDebtIds, ...newDebtIds]));

          alert(`✅ ${data.message || 'Mensualidades generadas exitosamente.'}\nSe han incluido en la lista de cobro actual.`);
          render();
        } else {
          alert(`⚠️ ${data.message || 'Error al generar mensualidades por adelantado.'}`);
        }
      } catch (err) {
        alert(`⚠️ Error de red al comunicarse con el servidor: ${err.message}`);
      }
    }

    async function deleteUnpaidDebt(debtId) {
      if (!confirm("¿Estás seguro de eliminar esta cuota adelantada no pagada de la lista de cobro?")) {
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/payments/debts/delete-unpaid`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${state.token}`
          },
          body: JSON.stringify({ debtId })
        });
        const data = await res.json();
        if (res.ok) {
          state.selectedDebtIds = state.selectedDebtIds.filter(id => id !== debtId);
          state.debts = state.debts.filter(d => d.id !== debtId);
          if (state.allFamilyDebts) {
            state.allFamilyDebts = state.allFamilyDebts.filter(d => d.id !== debtId);
          }
          if (state.familyData?.students?.[0]?.id) {
            const currentStudentId = state.selectedStudent ? state.selectedStudent.id : null;
            await selectStudent(state.familyData.students[0].id, currentStudentId);
          } else {
            render();
          }
        } else {
          alert(`⚠️ ${data.message || 'No se pudo eliminar la cuota.'}`);
        }
      } catch (err) {
        alert(`⚠️ Error: ${err.message}`);
      }
    }

    // Rates & Tuition Panel Integration
    async function loadTuitionRatesData() {
      try {
        const res = await fetch(`${API_BASE}/api/payments/tuition-rates`, {
          headers: { Authorization: `Bearer ${state.token}` }
        });
        const data = await res.json();
        state.tuitionRatesData = data;
        state.globalTuitionInput = data.globalAmountUSD || 50.0;
        state.enrollmentAmount2026 = data.enrollmentAmount2026 || 100.0;
        state.enrollmentAmount2027 = data.enrollmentAmount2027 || 120.0;
        if (data.groupSummary) {
          state.groupTuitionInputs = { ...data.groupSummary };
        }
        if (data.rates) {
          const gMap = {};
          data.rates.forEach(r => { gMap[r.gradeCode] = r.amountUSD; });
          state.gradeTuitionInputs = gMap;
        }
      } catch (e) {
        console.error('Error cargando tarifas de mensualidad:', e);
      }
    }

    async function saveEnrollmentAmount(schoolYear) {
      const inputId = schoolYear === '2026-2027' ? 'enrollment_amount_2026_2027' : 'enrollment_amount_2027_2028';
      const amountUSD = parseFloat(document.getElementById(inputId)?.value);
      if (isNaN(amountUSD) || amountUSD <= 0) {
        alert('⚠️ Por favor ingrese un monto válido mayor a $0 USD.');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/payments/re-enrollment/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
          body: JSON.stringify({ enabled: state.reEnrollmentEnabled, schoolYear, amountUSD })
        });
        const data = await res.json();
        if (res.ok) {
          alert(`✅ Monto de Matrícula para el período ${schoolYear} actualizado a $${amountUSD.toFixed(2)} USD.`);
          loadTuitionRatesData();
        } else {
          alert(data.message || 'Error actualizando monto de matrícula');
        }
      } catch (e) {
        console.error(e);
        alert('Error al conectar con el servidor.');
      }
    }

    async function saveTuitionRates(mode) {
      let payload = { mode };
      if (mode === 'GLOBAL') {
        payload.globalAmountUSD = parseFloat(document.getElementById('tuition_global_input')?.value) || state.globalTuitionInput;
      } else if (mode === 'GROUP') {
        payload.groupAmountsUSD = {
          'Primaria': parseFloat(document.getElementById('tuition_group_primaria')?.value) || 50.0,
          'Educación Básica': parseFloat(document.getElementById('tuition_group_basica')?.value) || 50.0,
          'Media y Diversificada': parseFloat(document.getElementById('tuition_group_media')?.value) || 50.0,
        };
      } else if (mode === 'GRADE') {
        const gradeMap = {};
        if (state.tuitionRatesData?.rates) {
          state.tuitionRatesData.rates.forEach(r => {
            const inp = document.getElementById(`tuition_grade_${r.gradeCode.replace(/\s+/g, '_')}`);
            gradeMap[r.gradeCode] = parseFloat(inp?.value) || r.amountUSD;
          });
        }
        payload.gradeAmountsUSD = gradeMap;
      }

      try {
        const res = await fetch(`${API_BASE}/api/payments/tuition-rates`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          alert('✅ Tarifas de Mensualidad actualizadas exitosamente en el sistema.');
          loadTuitionRatesData();
        } else {
          alert(data.message || 'Error al actualizar las tarifas');
        }
      } catch (e) {
        console.error(e);
        alert('Error al conectar con el servidor.');
      }
    }

    async function triggerMonthlyTuitionGeneration(targetYear = null, targetMonth = null) {
      try {
        const payload = {};
        if (targetYear && targetMonth) {
          payload.targetYear = parseInt(targetYear, 10);
          payload.targetMonth = parseInt(targetMonth, 10);
        }
        const res = await fetch(`${API_BASE}/api/payments/tuition-rates/generate-monthly`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          alert(`✅ ${data.message}\n\n• Deudas creadas: ${data.createdCount || 0}\n• Ya existentes (omitidas): ${data.alreadyBilledCount || 0}\n• Estudiantes sin tarifa / inactivos: ${data.skippedCount || 0}`);
        } else {
          alert(`⚠️ ${data.message || 'Error al generar la mensualidad'}`);
        }
      } catch (e) {
        console.error(e);
        alert('Error al conectar con el servidor.');
      }
    }

    async function broadcastAdditionalCharge() {
      const conceptName = document.getElementById('custom_charge_name')?.value?.trim();
      const amountUSD = parseFloat(document.getElementById('custom_charge_amount')?.value);
      const targetGrade = document.getElementById('custom_charge_target')?.value || 'ALL';
      const dueDate = document.getElementById('custom_charge_duedate')?.value || '';

      if (!conceptName) {
        alert('⚠️ Por favor ingresa el nombre del cobro o concepto adicional.');
        return;
      }
      if (isNaN(amountUSD) || amountUSD <= 0) {
        alert('⚠️ Por favor ingresa un monto válido mayor a $0 USD.');
        return;
      }

      const targetText = targetGrade === 'ALL' ? 'TODOS los estudiantes activos' : `los estudiantes de: ${targetGrade}`;
      if (!confirm(`¿Estás seguro de emitir el cobro adicional:\n\n• Concepto: "${conceptName}"\n• Monto: $${amountUSD.toFixed(2)} USD\n• Destinatarios: ${targetText}\n\nEsta acción asignará automáticamente la deuda a todos los estudiantes de la selección.`)) {
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/payments/fee-concepts/broadcast-charge`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
          body: JSON.stringify({ conceptName, amountUSD, targetGrade, dueDate })
        });
        const data = await res.json();
        if (res.ok) {
          alert(`✅ ${data.message}`);
          if (document.getElementById('custom_charge_name')) document.getElementById('custom_charge_name').value = '';
          if (document.getElementById('custom_charge_amount')) document.getElementById('custom_charge_amount').value = '';
        } else {
          alert(`⚠️ ${data.message || data.error || 'Error al emitir el cobro adicional'}`);
        }
      } catch (e) {
        console.error(e);
        alert('Error al conectar con el servidor.');
      }
    }

    async function loadReEnrollmentSettings() {
      try {
        const res = await fetch(`${API_BASE}/api/payments/re-enrollment/settings`, {
          headers: { Authorization: `Bearer ${state.token}` }
        });
        if (res.ok) {
          const data = await res.json();
          state.reEnrollmentEnabled = data.enabled;
        }
      } catch (e) {
        console.error('Error cargando configuración re-inscripción:', e);
      }
    }

    async function loadReEnrollmentData() {
      state.loadingReEnrollment = true;
      render();
      try {
        const res = await fetch(`${API_BASE}/api/payments/re-enrollment/summary?schoolYear=2027-2028`, {
          headers: { Authorization: `Bearer ${state.token}` }
        });
        if (res.ok) {
          const data = await res.json();
          state.reEnrollmentData = data;
          state.reEnrollmentEnabled = data.enabled;
        }
      } catch (e) {
        console.error('Error cargando datos re-inscripción:', e);
      } finally {
        state.loadingReEnrollment = false;
        render();
      }
    }

    async function toggleReEnrollmentModule(enabled) {
      const amountUSD = parseFloat(document.getElementById('super_enrollment_amount')?.value || 120.0);
      try {
        const res = await fetch(`${API_BASE}/api/payments/re-enrollment/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
          body: JSON.stringify({ enabled, amountUSD })
        });
        const data = await res.json();
        if (res.ok) {
          alert(`✅ ${data.message}`);
          state.reEnrollmentEnabled = enabled;
          loadReEnrollmentData();
        } else {
          alert(`⚠️ ${data.message || 'Error al cambiar estado del módulo'}`);
        }
      } catch (e) {
        console.error(e);
        alert('Error al conectar con el servidor.');
      }
    }

    async function loadBackupsData() {
      state.loadingBackups = true;
      render();
      try {
        const res = await fetch(`${API_BASE}/api/admin/backups`, {
          headers: { 'Authorization': `Bearer ${state.token}` }
        });
        if (res.ok) {
          const data = await res.json();
          state.backupsData = data;
        } else {
          const err = await res.json();
          alert(`⚠️ ${err.message || 'Error al obtener respaldos'}`);
        }
      } catch (e) {
        console.error('Error al cargar respaldos:', e);
      } finally {
        state.loadingBackups = false;
        render();
      }
    }

    async function createManualBackup() {
      if (state.creatingBackup) return;
      state.creatingBackup = true;
      render();
      try {
        const res = await fetch(`${API_BASE}/api/admin/backups/create`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${state.token}`,
            'Content-Type': 'application/json'
          }
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert(`✅ Respaldo creado exitosamente: ${data.filename}`);
          await loadBackupsData();
        } else {
          alert(`⚠️ ${data.message || 'Error al crear respaldo'}`);
        }
      } catch (e) {
        console.error('Error al crear respaldo:', e);
        alert('Error de conexión al crear respaldo.');
      } finally {
        state.creatingBackup = false;
        render();
      }
    }

    function downloadBackupFile(filename) {
      const url = `${API_BASE}/api/admin/backups/download?file=${encodeURIComponent(filename)}&token=${encodeURIComponent(state.token)}`;
      window.open(url, '_blank');
    }

    async function restoreBackupFile(filename) {
      if (!confirm(`⚠️ ADVERTENCIA CRÍTICA:\n\n¿Estás seguro de que deseas restaurar la base de datos al estado del respaldo '${filename}'?\n\nSe creará un respaldo de seguridad automático antes de realizar la restauración.`)) {
        return;
      }

      state.restoringBackup = true;
      render();
      try {
        const res = await fetch(`${API_BASE}/api/admin/backups/restore`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${state.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ filename })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert(`🎉 ${data.message}\n\nBase de datos restaurada correctamente.`);
          window.location.reload();
        } else {
          alert(`⚠️ ${data.message || 'Error al restaurar respaldo'}`);
        }
      } catch (e) {
        console.error('Error al restaurar:', e);
        alert('Error de conexión al restaurar la base de datos.');
      } finally {
        state.restoringBackup = false;
        render();
      }
    }

    async function restoreFromUploadedFile(inputElement) {
      const file = inputElement.files[0];
      if (!file) return;

      if (!confirm(`⚠️ ADVERTENCIA CRÍTICA:\n\n¿Deseas subir y restaurar la base de datos desde el archivo seleccionado '${file.name}'?\n\nSe creará un respaldo de seguridad automático antes de la restauración.`)) {
        inputElement.value = '';
        return;
      }

      state.restoringBackup = true;
      render();
      try {
        const formData = new FormData();
        formData.append('file', file);

        const res = await fetch(`${API_BASE}/api/admin/backups/restore`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${state.token}`
          },
          body: formData
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert(`🎉 ${data.message}\n\nBase de datos restaurada correctamente desde el archivo subido.`);
          window.location.reload();
        } else {
          alert(`⚠️ ${data.message || 'Error al restaurar desde archivo subido'}`);
        }
      } catch (e) {
        console.error('Error al restaurar archivo subido:', e);
        alert('Error al conectar con el servidor.');
      } finally {
        state.restoringBackup = false;
        inputElement.value = '';
        render();
      }
    }

    async function loadUsersData() {
      state.loadingUsers = true;
      render();
      try {
        const res = await fetch(`${API_BASE}/api/admin/users`, {
          headers: { 'Authorization': `Bearer ${state.token}` }
        });
        if (res.ok) {
          const data = await res.json();
          state.usersList = data.users || [];
          state.availableRoles = data.roles || [];
        } else {
          const err = await res.json();
          alert(err.message || 'Error al cargar usuarios.');
        }
      } catch (e) {
        console.error('Error loading users:', e);
        alert('Error de conexión al cargar usuarios.');
      } finally {
        state.loadingUsers = false;
        render();
      }
    }

    function openCreateUserModal() {
      state.showCreateUserModal = true;
      render();
    }

    function closeCreateUserModal() {
      state.showCreateUserModal = false;
      render();
    }

    async function submitCreateUser(e) {
      if (e) e.preventDefault();
      const username = document.getElementById('new_u_username')?.value.trim();
      const fullName = document.getElementById('new_u_fullname')?.value.trim();
      const email = document.getElementById('new_u_email')?.value.trim();
      const roleId = document.getElementById('new_u_role')?.value;
      const password = document.getElementById('new_u_password')?.value.trim();

      if (!username || username.length < 3) {
        alert('El usuario debe tener al menos 3 caracteres.');
        return;
      }
      if (!fullName) {
        alert('El nombre completo es obligatorio.');
        return;
      }
      if (!password || password.length < 4) {
        alert('La contraseña debe tener al menos 4 caracteres.');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/admin/users`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${state.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, fullName, email, roleId, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert(`✅ ${data.message}`);
          state.showCreateUserModal = false;
          await loadUsersData();
        } else {
          alert(`❌ ${data.message || 'Error al crear usuario'}`);
        }
      } catch (err) {
        console.error(err);
        alert('Error de conexión al crear usuario.');
      }
    }

    function openResetPasswordModal(userId) {
      const u = (state.usersList || []).find(x => x.id === userId);
      if (!u) return;
      state.userToReset = u;
      state.showResetPasswordModal = true;
      render();
    }

    function closeResetPasswordModal() {
      state.showResetPasswordModal = false;
      state.userToReset = null;
      render();
    }

    async function submitResetPassword(e) {
      if (e) e.preventDefault();
      if (!state.userToReset) return;
      const newPassword = document.getElementById('reset_new_password')?.value.trim();
      if (!newPassword || newPassword.length < 4) {
        alert('La nueva contraseña debe tener al menos 4 caracteres.');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/admin/users/${state.userToReset.id}/reset-password`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${state.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ newPassword })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert(`✅ ${data.message}`);
          closeResetPasswordModal();
          await loadUsersData();
        } else {
          alert(`❌ ${data.message || 'Error al resetear contraseña'}`);
        }
      } catch (err) {
        console.error(err);
        alert('Error de conexión al resetear contraseña.');
      }
    }

    async function toggleUserStatus(userId) {
      const u = (state.usersList || []).find(x => x.id === userId);
      if (!u) return;
      if (!confirm(`¿Estás seguro de que deseas ${u.isActive ? 'desactivar' : 'activar'} la cuenta de "${u.username}"?`)) {
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/admin/users/${u.id}/toggle-status`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${state.token}` }
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alert(`✓ ${data.message}`);
          await loadUsersData();
        } else {
          alert(`❌ ${data.message || 'Error al actualizar estado del usuario'}`);
        }
      } catch (err) {
        console.error(err);
        alert('Error de conexión.');
      }
    }
