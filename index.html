    async function advanceTimeSimulation(params) {
      state.loadingTimeSimulation = true;
      try {
        const res = await fetch(`${API_BASE}/api/admin/time-simulation/set`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${state.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(params)
        });
        const data = await res.json();
        if (res.ok && data.success) {
          let msg = `⏰ ${data.message}`;
          if (data.simulation?.monthsBilled?.length > 0) {
            const billedStr = data.simulation.monthsBilled.map(m => `${m.monthName} ${m.year} (${m.generatedCount} estudiantes)`).join(', ');
            msg += `\n\n🎉 Se generaron automáticamente las mensualidades de: ${billedStr}`;
          }
          alert(msg);
          await loadTimeSimulationData();
          if (state.activeTab === 'cashier' && state.selectedStudent) {
            searchStudent(state.selectedStudent.id);
          } else if (state.activeTab === 'students') {
            loadStudentsData();
          } else if (state.activeTab === 'reenrollment') {
            loadReEnrollmentData();
          }
        } else {
          alert(`⚠️ ${data.message || 'Error al avanzar tiempo'}`);
        }
      } catch (e) {
        console.error('Error al avanzar tiempo:', e);
        alert('Error de conexión al simular tiempo.');
      } finally {
        state.loadingTimeSimulation = false;
        state.showTimeMachineModal = false;
        render();
      }
    }

          method: 'POST',

        } else {

        console.error('Error al restablecer tiempo:', e);
      } finally {
        state.loadingTimeSimulation = false;
        state.showTimeMachineModal = false;
        render();
      }
    }

    async function confirmPaperCheck(confirmed) {
      let actualPaperNumber = null;
      let reasonText = '';

      if (!confirmed) {
        const inputVal = document.getElementById('actual_paper_input')?.value;
        reasonText = document.getElementById('paper_reason_input')?.value || 'Inconsistencia reportada por cajera';
        if (!inputVal || isNaN(parseInt(inputVal))) {
          alert('Por favor ingrese un número válido de hoja membretada.');
          return;
        }
        actualPaperNumber = parseInt(inputVal);
      }

      try {
        const res = await fetch(`${API_BASE}/api/payments/paper-control/sync`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
          body: JSON.stringify({ confirmed, actualPaperNumber, reason: reasonText })
        });
        const data = await res.json();
        if (res.ok) {
          if (!confirmed) {
            alert(`✅ Impresora y control de hojas registrados auditadamente a la hoja #${data.currentNumber}`);
          }
          state.showPaperCheckModal = false;
          state.showPaperDiscrepancyInput = false;
          state.pendingPaperCheckNumber = null;
          await loadPaperControlData();
          await loadPaperLogs();
          render();
        } else {
          alert('⚠️ Error al registrar la verificación: ' + (data.message || 'Error'));
        }
      } catch (e) {
        console.error('Error en verificación de hoja:', e);
        alert('Error de conexión al sincronizar la hoja membretada.');
      }
    }

          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
          body: JSON.stringify({ exchangeRate: rate, source: source })
        });
        const data = await res.json();
        if (res.ok) {
          state.exchangeRate = rate;
          alert(`✅ Tasa de cambio del sistema actualizada a ${rate.toFixed(2)} VES/USD (Fuente: ${source})`);
          loadRatesData();
        } else {
          alert(data.message || 'Error al actualizar la tasa');
        }
      } catch (e) {
        console.error(e);
        alert('Error al conectar con el servidor.');
      }
    }

    async function loadStudentsData() {
      state.studentsLoading = true;
      render();
      try {
        const q = encodeURIComponent(state.studentsSearchQuery || '');
        const status = state.studentsStatusFilter || 'ALL';
        const [stRes, gRes] = await Promise.all([
          fetch(`${API_BASE}/api/students/manage?status=${status}&q=${q}`, {
            headers: { Authorization: `Bearer ${state.token}` }
          }),
          fetch(`${API_BASE}/api/students/guardians`, {
            headers: { Authorization: `Bearer ${state.token}` }
          })
        ]);
        if (stRes.ok) {
          const data = await stRes.json();
          state.studentsList = data.students || [];
        }
        if (gRes.ok) {
          const gData = await gRes.json();
          state.studentsGuardiansList = gData.guardians || [];
        }
      } catch (err) {
        console.error("Error cargando estudiantes y representados:", err);
      } finally {
        state.studentsLoading = false;
        state.studentsLoaded = true;
        render();
      }
    }

      if (!state.studentsLoaded && !state.studentsLoading) {
        loadStudentsData();
      }

      return `

                <i data-lucide="upload"></i> Carga Masiva (CSV / Excel)
              </button>

                <i data-lucide="user-plus"></i> + Nuevo Representado

                    <td>

                      ${s.status === 'FROZEN' ? `<span class="badge" style="background:rgba(56,189,248,0.2); color:#38bdf8; border:1px solid #38bdf8;">❄️ CONGELADO</span>` : ''}
                      ${s.status === 'INACTIVE' ? `<span class="badge badge-danger">🔴 INACTIVO</span>` : ''}
                      ${s.isScholarship && s.scholarshipPct > 0 ? `<br><span class="badge" style="background:rgba(168,85,247,0.25); color:#c084fc; border:1px solid #c084fc; margin-top:3px; font-size:0.7rem;" title="Motivo: ${s.scholarshipReason || 'Sin motivo especificado'}">🎓 Beca ${s.scholarshipPct}%</span>` : ''}

                                title="${s.status === 'FROZEN' ? 'Descongelar Estudiante' : 'Congelar Estudiante'}">

    }

    function openStudentModal(studentId = null) {
      if (studentId) {
        state.editingStudent = state.studentsList.find(s => s.id === studentId) || null;
      } else {
        state.editingStudent = null;
      }
      state.showStudentModal = true;
      render();
    }

      const firstName = document.getElementById('st_first_name')?.value?.trim();
      const lastName = document.getElementById('st_last_name')?.value?.trim();
      const docId = document.getElementById('st_doc_id')?.value?.trim();
      const grade = document.getElementById('st_grade')?.value;
      const section = document.getElementById('st_section')?.value || 'A';
      const status = document.getElementById('st_status')?.value || 'ACTIVE';

      const guardianSelect = document.getElementById('st_guardian_select')?.value;
      const repDocId = document.getElementById('rep_doc_id')?.value?.trim();
      const repName = document.getElementById('rep_name')?.value?.trim();
      const repPhone = document.getElementById('rep_phone')?.value?.trim();
      const repEmail = document.getElementById('rep_email')?.value?.trim();

      if (!firstName || !grade) {
        alert("Por favor ingrese el nombre del estudiante y seleccione su grado.");
        return;
      }

      const isScholarship = document.getElementById('st_is_scholarship')?.checked || false;
      const scholarshipPct = parseFloat(document.getElementById('st_scholarship_pct')?.value || 0);
      const scholarshipReason = document.getElementById('st_scholarship_reason')?.value?.trim() || '';

      let payload = {
        studentId: state.editingStudent?.id || null,
        firstName,
        lastName,
        docId,
        grade,
        section,
        status,
        isScholarship,
        scholarshipPct,
        scholarshipReason
      };

      if (guardianSelect && guardianSelect !== 'NEW') {
        payload.guardianId = guardianSelect;
      } else {
        if (!repName) {
          alert("Por favor ingrese el nombre del representante.");
          return;
        }
        payload.guardian = {
          docId: repDocId,
          fullName: repName,
          phone: repPhone,
          email: repEmail
        };
      }

      try {
        const res = await fetch(`${API_BASE}/api/students/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${state.token}` },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          state.showStudentModal = false;
          state.editingStudent = null;
          loadStudentsData();
        } else {
          alert(data.error || "Error al guardar representado.");
        }
      } catch (err) {
        console.error("Error guardando estudiante:", err);
        alert("Error de conexión al guardar.");
      }

    function handleBatchFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      const filename = file.name.toLowerCase();

      if (filename.endsWith('.xlsx') || filename.endsWith('.xls')) {
        reader.onload = function(e) {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);
            state.batchPreviewRecords = jsonData;
            render();
          } catch (err) {
            console.error("Error leyendo archivo Excel:", err);
            alert("Error al procesar el archivo Excel. Asegúrese de que sea un formato válido.");
          }
        };
        reader.readAsArrayBuffer(file);
      } else {
        // Plain CSV fallback
        reader.onload = function(e) {
          try {
            const text = e.target.result;
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            if (lines.length <= 1) {
              alert("El archivo CSV está vacío o no contiene filas de datos.");
              return;
            }
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const records = [];
            for (let i = 1; i < lines.length; i++) {
              const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
              if (values.length >= 2) {
                let rec = {};
                headers.forEach((h, idx) => {
                  rec[h] = values[idx] || '';
                });
                records.push(rec);
              }
            }
            state.batchPreviewRecords = records;
            render();
          } catch (err) {
            console.error("Error leyendo CSV:", err);
            alert("Error al leer el archivo CSV.");
          }
        };
        reader.readAsText(file);
      }
    }

    function updateScholarshipPreview() {
      const isChecked = document.getElementById('st_is_scholarship')?.checked;
      const pctInput = parseFloat(document.getElementById('st_scholarship_pct')?.value || 0);
      const box = document.getElementById('scholarship_preview_box');
      if (!box) return;

      if (!isChecked || pctInput <= 0) {
        box.innerHTML = `<span>ℹ️ No se aplicará descuento. El estudiante pagará el 100% de la mensualidad base ($50.00 USD).</span>`;
        return;
      }

      const validPct = Math.min(100, Math.max(0, pctInput));
      const basePrice = 50.0;
      const discounted = basePrice * (1 - validPct / 100);
      const remainingPct = 100 - validPct;

      box.innerHTML = `
        <span>🎓 <strong>Beca de ${validPct}% Aplicada:</strong> Para una mensualidad base de $${basePrice.toFixed(2)} USD, el estudiante solo cancelará <strong>$${discounted.toFixed(2)} USD (${remainingPct}%)</strong>.</span>
      `;
    }

    async function loadDailyReconciliationData() {

        const res = await fetch(`${API_BASE}/api/payments/daily-reconciliation?date=${d}`, {
          headers: { Authorization: `Bearer ${state.token}` }
        });
        if (res.ok) {
          state.reconciliationData = await res.json();

      } catch (err) {

      } finally {
        state.reconciliationLoading = false;

      }
    }

    async function processBankReconciliation() {
      const text = state.reconciliationRawText || '';
      if (!text.trim()) {
        alert('Por favor ingrese o pegue los datos del estado de cuenta bancario.');
        return;
      }

      state.reconciliationLoading = true;
      state.reconciliationMessage = null;
      render();

      try {
        const res = await fetch(`${API_BASE}/api/payments/reconcile`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${state.token}`
          },
          body: JSON.stringify({ rawText: text })
        });
        const data = await res.json();
        if (res.ok) {
          state.reconciliationMessage = {
            type: 'success',
            text: `✓ ${data.message} Detalle: ${data.summary.exactMatches} exactos (Verde), ${data.summary.greaterMatches} con monto mayor (+) (Púrpura/Naranja), ${data.summary.unreconciledMatches} referencias no encontradas (Rojo).`
          };
          await loadDailyReconciliationData();
        } else {
          state.reconciliationMessage = { type: 'error', text: data.message || 'Error al conciliar' };
        }
      } catch (err) {
        state.reconciliationMessage = { type: 'error', text: 'Error de conexión al servidor al conciliar.' };
      } finally {
        state.reconciliationLoading = false;
        render();
      }
    }

    function handleReconciliationFileSelect(evt) {
      const file = evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        state.reconciliationRawText = e.target.result || '';
        render();
      };
      reader.readAsText(file);
    }

    function renderReconciliationView() {
      if (!state.reconciliationData && !state.reconciliationLoading) {
        loadDailyReconciliationData();
      }

      const rec = state.reconciliationData || { payments: [], summary: { totalPayments: 0, conciliatedCount: 0, greaterCount: 0, unreconciledCount: 0, pendingCount: 0 } };
      const summary = rec.summary || { totalPayments: 0, conciliatedCount: 0, greaterCount: 0, unreconciledCount: 0, pendingCount: 0 };
      const filter = state.reconciliationFilter || 'ALL';

      let filteredPayments = rec.payments || [];
      if (filter === 'PENDING') {
        filteredPayments = filteredPayments.filter(p => p.methods.some(m => ['PAGO_MOVIL', 'TRANSFER_VES'].includes(m.method) && m.reconciliationStatus === 'PENDIENTE'));
      } else if (filter === 'CONCILIADO') {
        filteredPayments = filteredPayments.filter(p => p.methods.some(m => m.reconciliationStatus === 'CONCILIADO'));
      } else if (filter === 'CONCILIADO_MAYOR') {
        filteredPayments = filteredPayments.filter(p => p.methods.some(m => m.reconciliationStatus === 'CONCILIADO_MAYOR'));
      } else if (filter === 'NO_CONCILIADO') {
        filteredPayments = filteredPayments.filter(p => p.methods.some(m => m.reconciliationStatus === 'NO_CONCILIADO'));
      }

      return `
        <div>
          <!-- Header -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
            <div>
              <h2 style="font-size:1.6rem; font-weight:800; color:#f9fafb; display:flex; align-items:center; gap:0.5rem;">
                <i data-lucide="check-square" style="color:#10b981;"></i> Conciliación Bancaria Diaria
              </h2>
              <p style="color:#9ca3af; font-size:0.85rem; margin-top:0.2rem;">Almacenamiento, consulta y conciliación automática con el estado de cuenta bancario ($ / Bs).</p>
            </div>
            
            <div style="display:flex; gap:0.75rem; align-items:center;">
              <input type="date" value="${state.reconciliationDate}" onchange="state.reconciliationDate=this.value; loadDailyReconciliationData();" class="glass-input" style="padding:0.5rem 0.75rem; width:auto; border-radius:8px; font-weight:600;">
              <button onclick="loadDailyReconciliationData()" class="btn btn-secondary" style="padding:0.5rem 1rem;">
                <i data-lucide="refresh-cw"></i> Actualizar
              </button>
            </div>
          </div>

          <!-- Metricas de Conciliacion -->
          <div class="dashboard-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom:1.5rem;">
            
            <div class="glass-card" style="padding:1.25rem;">
              <div style="font-size:0.8rem; font-weight:700; color:#9ca3af; text-transform:uppercase;">Transacciones Hoy</div>
              <div style="font-size:1.8rem; font-weight:900; color:#f3f4f6; margin-top:0.25rem;">${summary.totalPayments}</div>
              <div style="font-size:0.75rem; color:#6b7280; margin-top:0.25rem;">Pagos procesados en fecha</div>
            </div>

            <div class="glass-card" style="padding:1.25rem; border-left:4px solid #10b981;">
              <div style="font-size:0.8rem; font-weight:700; color:#34d399; text-transform:uppercase;">✓ Conciliados</div>
              <div style="font-size:1.8rem; font-weight:900; color:#34d399; margin-top:0.25rem;">${summary.conciliatedCount}</div>
              <div style="font-size:0.75rem; color:#a7f3d0; margin-top:0.25rem;">Coincidencia exacta de monto y ref.</div>
            </div>

            <div class="glass-card" style="padding:1.25rem; border-left:4px solid #a855f7;">
              <div style="font-size:0.8rem; font-weight:700; color:#c084fc; text-transform:uppercase;">⚠️ Monto Mayor (+)</div>
              <div style="font-size:1.8rem; font-weight:900; color:#c084fc; margin-top:0.25rem;">${summary.greaterCount}</div>
              <div style="font-size:0.75rem; color:#e9d5ff; margin-top:0.25rem;">Monto cajera mayor que banco (+)</div>
            </div>

            <div class="glass-card" style="padding:1.25rem; border-left:4px solid #ef4444;">
              <div style="font-size:0.8rem; font-weight:700; color:#f87171; text-transform:uppercase;">✕ Ref. No Encontrada</div>
              <div style="font-size:1.8rem; font-weight:900; color:#f87171; margin-top:0.25rem;">${summary.unreconciledCount}</div>
              <div style="font-size:0.75rem; color:#fca5a5; margin-top:0.25rem;">Referencia no encontrada en banco</div>
            </div>

          </div>

          <!-- Formulario de Conciliación Masiva con Estado de Cuenta (Solo Admin / Superadmin) -->
          ${hasPermission('payments:admin:view_history') ? `
            <div class="glass-panel" style="padding:1.5rem; margin-bottom:1.5rem;">
              <h3 style="font-size:1.1rem; font-weight:800; color:#f3f4f6; margin-bottom:0.5rem; display:flex; align-items:center; gap:0.5rem;">
                <i data-lucide="file-text" style="color:#818cf8;"></i> Importar y Procesar Estado de Cuenta del Banco
              </h3>
              <p style="font-size:0.85rem; color:#9ca3af; margin-bottom:1rem;">
                Pegue el texto del estado de cuenta emitido por el banco (Pago Móvil / Transferencias) o cargue un archivo plano (.csv/.txt). El sistema comparará automáticamente la referencia (5 últimos dígitos) y el monto en VES.
              </p>

              <div style="margin-bottom:1rem;">
                <textarea class="glass-input" rows="4" placeholder="Ejemplo de líneas del estado de cuenta bancario:\n98765   365,00\n11111   1000,00\n22222   1500,00" style="font-family:monospace; font-size:0.85rem;" onchange="state.reconciliationRawText=this.value;" oninput="state.reconciliationRawText=this.value;">${state.reconciliationRawText}</textarea>
              </div>

              ${state.reconciliationMessage ? `
                <div style="padding:0.75rem 1rem; background:${state.reconciliationMessage.type === 'success' ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)'}; border:1px solid ${state.reconciliationMessage.type === 'success' ? 'rgba(16,185,129,0.4)' : 'rgba(239,68,68,0.4)'}; border-radius:8px; color:${state.reconciliationMessage.type === 'success' ? '#34d399' : '#f87171'}; font-size:0.85rem; font-weight:600; margin-bottom:1rem;">
                  ${state.reconciliationMessage.text}
                </div>
              ` : ''}

              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
                <label class="btn btn-secondary" style="cursor:pointer; font-size:0.85rem;">
                  <i data-lucide="upload"></i> Cargar desde Archivo (.txt / .csv)
                  <input type="file" accept=".txt, .csv" style="display:none;" onchange="handleReconciliationFileSelect(event)">
                </label>

                <button onclick="processBankReconciliation()" class="btn btn-primary" style="background:linear-gradient(135deg, #4f46e5, #7c3aed); border:none; padding:0.7rem 1.5rem; font-weight:800;" ${state.reconciliationLoading ? 'disabled' : ''}>
                  ${state.reconciliationLoading ? '<i data-lucide="loader-2" class="spin"></i> Procesando Conciliación...' : '<i data-lucide="zap"></i> Conciliar con Estado de Cuenta'}
                </button>
              </div>
            </div>
          ` : `
            <div class="glass-panel" style="padding:1.25rem 1.5rem; margin-bottom:1.5rem; border-left:4px solid #818cf8; display:flex; align-items:center; gap:1rem;">
              <i data-lucide="shield-alert" style="width:2rem; height:2rem; color:#818cf8; flex-shrink:0;"></i>
              <div>
                <div style="font-weight:700; color:#f3f4f6; font-size:0.95rem;">Modo de Consulta de Caja</div>
                <div style="font-size:0.85rem; color:#9ca3af; margin-top:0.2rem;">
                  Como cajera, tienes acceso para <strong>consultar el estatus de conciliación</strong> de los pagos del día e <strong>imprimir las facturas</strong> que ya hayan sido conciliadas por la administración. El procesamiento del estado de cuenta bancario es una función exclusiva del rol Administrador.
                </div>
              </div>
            </div>
          `}

          <!-- Listado de Pagos Registrados del Día -->
          <div class="glass-panel" style="padding:1.5rem;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; flex-wrap:wrap; gap:1rem;">
              <h3 style="font-size:1.1rem; font-weight:800; color:#f3f4f6; display:flex; align-items:center; gap:0.5rem;">
                <i data-lucide="list" style="color:#60a5fa;"></i> Registro Consultable de Pagos del Día (${filteredPayments.length})
              </h3>

              <!-- Filtros de Estado -->
              <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
                <button onclick="state.reconciliationFilter='ALL'; render();" class="btn btn-sm ${filter === 'ALL' ? 'btn-primary' : 'btn-secondary'}">Todos</button>
                <button onclick="state.reconciliationFilter='PENDING'; render();" class="btn btn-sm ${filter === 'PENDING' ? 'btn-primary' : 'btn-secondary'}" style="color:#f59e0b;">⏳ Pendientes</button>
                <button onclick="state.reconciliationFilter='CONCILIADO'; render();" class="btn btn-sm ${filter === 'CONCILIADO' ? 'btn-primary' : 'btn-secondary'}" style="color:#10b981;">✓ Conciliados</button>
                <button onclick="state.reconciliationFilter='CONCILIADO_MAYOR'; render();" class="btn btn-sm ${filter === 'CONCILIADO_MAYOR' ? 'btn-primary' : 'btn-secondary'}" style="color:#a855f7;">⚠️ Monto Mayor (+)</button>
                <button onclick="state.reconciliationFilter='NO_CONCILIADO'; render();" class="btn btn-sm ${filter === 'NO_CONCILIADO' ? 'btn-primary' : 'btn-secondary'}" style="color:#ef4444;">✕ Ref. No Encontrada</button>
              </div>
            </div>

            <div class="table-container">
              <table class="custom-table">
                <thead>
                  <tr>
                    <th>N° Recibo / Hora</th>
                    <th>Cajera</th>
                    <th>Representante & Estudiante</th>
                    <th>Método / Banco / Ref.</th>
                    <th>Monto Declarado vs Banco</th>
                    <th>Estado Conciliación</th>
                    <th>Factura</th>
                  </tr>
                </thead>
                <tbody>
                  ${filteredPayments.length > 0 ? filteredPayments.map(p => {
                    return p.methods.map((m, idx) => {
                      let statusBadge = '';
                      if (m.method === 'PAGO_MOVIL' || m.method === 'TRANSFER_VES') {
                        if (m.reconciliationStatus === 'CONCILIADO') {
                          statusBadge = `<span class="badge" style="background:rgba(16,185,129,0.2); color:#34d399; border:1px solid rgba(16,185,129,0.4); font-weight:800;">✓ CONCILIADO</span>`;
                        } else if (m.reconciliationStatus === 'CONCILIADO_MAYOR') {
                          statusBadge = `<span class="badge" style="background:rgba(168,85,247,0.25); color:#c084fc; border:1px solid rgba(168,85,247,0.5); font-weight:800;">⚠️ CONCILIADO (+)</span>`;
                        } else if (m.reconciliationStatus === 'NO_CONCILIADO') {
                          statusBadge = `<span class="badge" style="background:rgba(239,68,68,0.25); color:#f87171; border:1px solid rgba(239,68,68,0.5); font-weight:800;">✕ REFERENCIA NO ENCONTRADA</span>`;
                        } else {
                          statusBadge = `<span class="badge" style="background:rgba(245,158,11,0.25); color:#fbbf24; border:1px solid rgba(245,158,11,0.5); font-weight:800;">⏳ PENDIENTE</span>`;
                        }
                      } else {
                        statusBadge = `<span class="badge" style="background:rgba(107,114,128,0.2); color:#9ca3af;">AUTO / DIRECTO</span>`;
                      }

                      let mLabel = m.method === 'PAGO_MOVIL' ? '📱 Pago Móvil' : (m.method === 'TRANSFER_VES' ? '🏦 Transferencia' : m.method);
                      const isLocked = !p.canPrintInvoice;

                      return `
                        <tr>
                          ${idx === 0 ? `
                            <td rowspan="${p.methods.length}" style="font-weight:700; color:#818cf8; vertical-align:top;">
                              ${p.receiptNumber}<br>
                              <span style="font-size:0.75rem; color:#9ca3af; font-weight:400;">${new Date(p.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                            </td>
                            <td rowspan="${p.methods.length}" style="font-size:0.85rem; vertical-align:top;">${p.cashierName}</td>
                            <td rowspan="${p.methods.length}" style="vertical-align:top;">
                              <div style="font-weight:700; color:#f3f4f6; font-size:0.85rem;">${p.representativeName}</div>
                              <div style="font-size:0.75rem; color:#9ca3af;">Est: ${p.studentNames}</div>
                            </td>
                          ` : ''}

                          <td style="font-size:0.85rem;">
                            <strong>${mLabel}</strong><br>
                            <span style="font-size:0.75rem; color:#9ca3af;">${m.bank ? `Banco: ${m.bank} | ` : ''}Ref: <strong>${m.reference || 'N/A'}</strong></span>
                          </td>

                          <td style="font-size:0.85rem;">
                            <div style="font-weight:800; color:#f3f4f6;">${m.currency === 'USD' ? `$${m.amount.toFixed(2)}` : `${m.amount.toLocaleString('es-VE', {minimumFractionDigits:2})} VES`}</div>
                            ${m.bankAmount > 0 ? `
                              <div style="font-size:0.75rem; color:${m.reconciliationStatus === 'CONCILIADO_MAYOR' ? '#c084fc' : '#34d399'}; font-weight:700;">
                                Bank: ${m.bankAmount.toLocaleString('es-VE', {minimumFractionDigits:2})} VES ${m.reconciliationStatus === 'CONCILIADO_MAYOR' ? '(+ Exceso rep.)' : ''}
                              </div>
                            ` : ''}
                          </td>

                          <td>${statusBadge}</td>

                          ${idx === 0 ? `
                            <td rowspan="${p.methods.length}" style="vertical-align:top;">
                              <button onclick="openReceiptModal('${p.id}')" class="btn btn-sm ${isLocked ? 'btn-secondary' : 'btn-primary'}" style="padding:0.4rem 0.75rem; font-size:0.8rem; ${isLocked ? 'color:#ef4444; border:1px solid rgba(239,68,68,0.4);' : ''}">
                                ${isLocked ? '<i data-lucide="lock"></i> Factura Bloqueada' : '<i data-lucide="file-text"></i> Ver Factura'}
                              </button>
                            </td>
                          ` : ''}
                        </tr>
                      `;
                    }).join('');
                  }).join('') : `
                    <tr>
                      <td colspan="7" style="text-align:center; padding:2rem; color:#9ca3af;">
                        No hay pagos registrados para la fecha seleccionada (${state.reconciliationDate}).
                      </td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // Initial Trigger (Bulletproof DOM rendering)
    function initApp() {
      if (window.location.protocol === 'file:') {
        const app = document.getElementById('app');
        if (app) {
          app.innerHTML = `
            <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; background:#0b0f19; color:#f3f4f6;">
              <div style="background:#131b2e; border:2px solid #6366f1; padding:2.5rem; border-radius:20px; text-align:center; max-width:600px; box-shadow:0 20px 50px rgba(0,0,0,0.7);">
                <div style="width:64px; height:64px; border-radius:16px; background:linear-gradient(135deg, #6366f1, #10b981); display:flex; align-items:center; justify-content:center; margin:0 auto 1.5rem auto; font-size:2rem;">
                  🌐
                </div>
                <h2 style="font-size:1.6rem; font-weight:800; color:#f3f4f6; margin-bottom:1rem;">Abre el Sistema en la Dirección Web</h2>
                <p style="color:#9ca3af; font-size:0.95rem; margin-bottom:1.5rem; line-height:1.6;">
                  Estás abriendo el archivo localmente (<code style="color:#f43f5e; background:rgba(244,63,94,0.15); padding:0.25rem 0.5rem; border-radius:6px;">file://</code>). Por restricciones de seguridad del navegador, los archivos locales no pueden conectarse a la Base de Datos.
                </p>
                <div style="background:rgba(11,15,25,0.8); border:1px solid rgba(99,102,241,0.4); padding:1.25rem; border-radius:12px; margin-bottom:1.5rem;">
                  <span style="font-size:0.8rem; color:#9ca3af; display:block; margin-bottom:0.4rem; font-weight:700; text-transform:uppercase;">Ingresa en la barra de tu navegador:</span>
                  <a href="http://localhost:3000" style="color:#818cf8; font-size:1.5rem; font-weight:800; text-decoration:none;">http://localhost:3000</a>
                </div>
                <a href="http://localhost:3000" class="btn btn-primary" style="font-size:1rem; padding:0.8rem 1.8rem;">
                  👉 Haz Clic Aquí para Entrar a http://localhost:3000
                </a>
              </div>
            </div>
          `;
        }
        return;
      }

      render();
      loadTimeSimulationData().then(() => render()).catch(e => console.error("Error async loadTimeSimulationData:", e));
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
